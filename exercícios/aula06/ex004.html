<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: rgba(89, 172, 172, 0.829);
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual o seu nome?')
        document.write(`<br> Olá <strong>${nome}</strong>, seu nome tem ${nome.length} letras. </br>`)
        document.write(`<br> Seu nome em letras maiúsculas é ${nome.toUpperCase()} </br>`)
        document.write(`<br> Seu nome em letras minúsculas é ${nome.toLowerCase()}</br>`)
    </script>
</body>
</html>
